name: Build Archium.exe

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon=Archium.ico launcher.py --name=Archium --distpath=. --workpath=build --specpath=.

    - name: Create release zip
      run: |
        $tag = "${{ github.ref }}".substring(10)
        $zipname = "archium-$tag.zip"
        New-Item -ItemType Directory -Name temp_release -Force
        Copy-Item .archium/archium.py temp_release/
        Copy-Item .archium/languages.json temp_release/
        Copy-Item .archium/version.json temp_release/
        Copy-Item Archium.ico temp_release/
        Copy-Item .archium/classes_and_funcs temp_release/ -Recurse
        New-Item -ItemType Directory -Path temp_release/db -Force | Out-Null
        Compress-Archive -Path temp_release/* -DestinationPath $zipname -Force
        Add-Type -AssemblyName System.IO.Compression
        $archive = [System.IO.Compression.ZipFile]::Open($zipname, [System.IO.Compression.ZipArchiveMode]::Update)
        try {
          $archive.CreateEntry("db/") | Out-Null
        } finally {
          $archive.Dispose()
        }
        Remove-Item temp_release -Recurse -Force
      shell: pwsh

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Archium.exe
          archium-*.zip
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up
      run: |
        Remove-Item -Recurse build -Force -ErrorAction SilentlyContinue
        Remove-Item -Recurse __pycache__ -Force -ErrorAction SilentlyContinue
        Remove-Item *.spec -Force -ErrorAction SilentlyContinue
      shell: pwsh
